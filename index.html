<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Reiseradar</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗺</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --bg:#f5f2ec;--surf:#fff;--ink:#1a1814;--ink2:#6b6660;--ink3:#a09a94;
  --acc:#c85a2a;--acc2:#2a7a50;--brd:rgba(26,24,20,.09);--rad:12px;
}
[data-theme=dark]{
  --bg:#111210;--surf:#1c1c1a;--ink:#f0ede6;--ink2:#8a8580;--ink3:#504d48;
  --acc:#e07040;--acc2:#3aaa70;--brd:rgba(240,237,230,.07);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink)}

/* HEADER */
header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;background:var(--surf);border-bottom:1px solid var(--brd);position:fixed;top:0;left:0;right:0;z-index:1000}
.logo{font-family:'DM Serif Display',serif;font-size:1.4rem;letter-spacing:-.02em;line-height:1}
.logo em{color:var(--acc);font-style:italic}
.hc{display:flex;gap:5px;align-items:center}

/* BUTTONS */
button{cursor:pointer;border:1px solid var(--brd);background:transparent;color:var(--ink);border-radius:8px;font-family:inherit;font-size:13px;padding:5px 11px;transition:background .15s,border-color .15s;white-space:nowrap}
button:hover{background:var(--brd)}
.bp{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:500}
.bp:hover{filter:brightness(.9);background:var(--acc)}
.la{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* MAIN LAYOUT */
.app{display:flex;height:calc(100vh - 52px);margin-top:52px}

/* SIDEBAR */
.sidebar{width:340px;flex-shrink:0;background:var(--surf);border-right:1px solid var(--brd);overflow-y:auto;display:flex;flex-direction:column;z-index:2}
.sidebar::-webkit-scrollbar{width:3px}
.sidebar::-webkit-scrollbar-thumb{background:var(--brd);border-radius:4px}
.ss{padding:1rem 1.25rem;border-bottom:1px solid var(--brd)}
.ss:last-child{border-bottom:none;flex:1}
.slbl{font-size:10px;font-weight:500;letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);margin-bottom:.6rem;display:block}

/* START INPUT */
.sinp{display:flex;gap:6px}
.sinp input{flex:1;border:1px solid var(--brd);background:var(--bg);color:var(--ink);border-radius:8px;font-family:inherit;font-size:14px;padding:7px 11px;outline:none;transition:border-color .15s;min-width:0}
.sinp input:focus{border-color:var(--acc)}
.presets{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.presets button{font-size:11px;padding:3px 9px;border-radius:20px}
.presets button.act{background:var(--acc);color:#fff;border-color:var(--acc)}

/* SLIDERS */
.srow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.srow:last-child{margin-bottom:0}
.srow-lbl{font-size:13px;color:var(--ink2);width:80px;flex-shrink:0}
.srow input[type=range]{flex:1;accent-color:var(--acc);cursor:pointer}
.sval{font-size:13px;font-weight:500;min-width:56px;text-align:right;color:var(--ink)}

/* STATS */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.sc{background:var(--bg);border-radius:8px;padding:8px 10px}
.sc-l{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin-bottom:2px}
.sc-v{font-size:18px;font-weight:500;font-family:'DM Serif Display',serif}
.sc-v.g{color:var(--acc2)}

/* FILTER TABS */
.ftabs{display:flex;gap:4px;flex-wrap:wrap}
.ftab{font-size:12px;padding:3px 10px;border-radius:20px;border:1px solid var(--brd);background:transparent;color:var(--ink2);cursor:pointer;transition:all .15s}
.ftab.act{background:var(--acc);color:#fff;border-color:var(--acc)}

/* SORT */
.sort-row{display:flex;align-items:center;gap:8px;margin-top:8px}
.sort-row span{font-size:12px;color:var(--ink3)}
select.fsort{border:1px solid var(--brd);background:var(--bg);color:var(--ink);font-family:inherit;font-size:12px;padding:3px 8px;border-radius:8px;outline:none;cursor:pointer}

/* CITY LIST */
ul.clist{list-style:none}
li.ci{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--brd);cursor:pointer;transition:background .1s,padding .1s;border-radius:4px}
li.ci:last-child{border-bottom:none}
li.ci:hover{background:var(--bg);padding-left:6px;padding-right:6px}
.cdot{width:9px;height:9px;border-radius:50%;flex-shrink:0;background:var(--acc)}
.cdot.out{background:var(--ink3)}
.cdot.nat{background:var(--acc2)}
.cn{font-size:13px;font-weight:500;flex:1}
.cd{font-size:11px;color:var(--ink3)}
.ct{font-size:10px;padding:2px 6px;border-radius:20px;font-weight:500;background:rgba(200,90,42,.1);color:var(--acc)}
.ct.nat{background:rgba(42,122,80,.1);color:var(--acc2)}

/* MAP */
.map-wrap{flex:1;position:relative}
#map{width:100%;height:100%}

/* MAP CONTROLS overlay */
.map-info{position:absolute;top:12px;left:12px;z-index:500;background:var(--surf);border:1px solid var(--brd);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--ink2);box-shadow:0 2px 12px rgba(0,0,0,.1);pointer-events:none}
.map-info strong{display:block;font-size:13px;color:var(--ink);font-weight:500;margin-bottom:2px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:2000;display:none;align-items:center;justify-content:center;padding:1rem}
.overlay.open{display:flex}
.modal{background:var(--surf);border-radius:16px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;padding:2rem;position:relative;box-shadow:0 24px 64px rgba(0,0,0,.2)}
.modal::-webkit-scrollbar{width:4px}
.modal::-webkit-scrollbar-thumb{background:var(--brd);border-radius:4px}
.mclose{position:absolute;top:1rem;right:1rem;width:30px;height:30px;padding:0;display:flex;align-items:center;justify-content:center;font-size:16px}
.mname{font-family:'DM Serif Display',serif;font-size:1.9rem;line-height:1;margin-bottom:.15rem}
.mcountry{color:var(--ink2);font-size:13px;margin-bottom:1rem}
.mstats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:1rem}
.ms{background:var(--bg);border-radius:8px;padding:9px 10px}
.ms-l{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink3);margin-bottom:2px}
.ms-v{font-size:14px;font-weight:500}
.msec{margin-bottom:1rem}
.msec h4{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink3);margin-bottom:.45rem}
.hllist{list-style:none}
.hllist li{font-size:13px;color:var(--ink2);padding:4px 0;border-bottom:1px solid var(--brd);display:flex;gap:8px}
.hllist li:last-child{border-bottom:none}
.hllist li::before{content:'→';color:var(--acc);flex-shrink:0}
.wbadges{display:flex;gap:5px;flex-wrap:wrap}
.wb{font-size:11px;padding:4px 9px;border-radius:20px;background:var(--bg);border:1px solid var(--brd);color:var(--ink2)}
.tips-p{font-size:13px;color:var(--ink2);line-height:1.65}
.mlinks{display:flex;gap:7px;margin-top:.9rem;flex-wrap:wrap}
.mlinks a{font-size:12px;padding:5px 11px;border-radius:8px;border:1px solid var(--brd);color:var(--ink2);text-decoration:none;transition:all .15s}
.mlinks a:hover{border-color:var(--acc);color:var(--acc)}

/* LEAFLET overrides */
.leaflet-popup-content-wrapper{border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15)}
.leaflet-popup-content{margin:10px 14px;font-family:'DM Sans',sans-serif;font-size:13px;min-width:140px}
.popup-name{font-family:'DM Serif Display',serif;font-size:15px;margin-bottom:4px;color:#1a1814}
.popup-row{color:#6b6660;font-size:12px;margin-bottom:2px;display:flex;justify-content:space-between;gap:12px}
.popup-badge{font-size:10px;font-weight:500;padding:2px 7px;border-radius:20px;margin-top:5px;display:inline-block}
.popup-badge.in{background:rgba(200,90,42,.12);color:#c85a2a}
.popup-badge.nat-in{background:rgba(42,122,80,.12);color:#2a7a50}
.popup-badge.out{background:rgba(160,154,148,.12);color:#a09a94}
.popup-btn{margin-top:7px;display:block;text-align:center;font-size:11px;padding:4px 10px;border-radius:7px;border:1px solid rgba(26,24,20,.1);color:#6b6660;cursor:pointer;background:transparent;font-family:inherit;width:100%}
.popup-btn:hover{background:rgba(200,90,42,.08);border-color:#c85a2a;color:#c85a2a}

/* Mobile */
@media(max-width:700px){
  .app{flex-direction:column}
  .sidebar{width:100%;max-height:45vh;border-right:none;border-bottom:1px solid var(--brd)}
}
</style>
</head>
<body data-theme="light">

<header>
  <div class="logo">Reise<em>radar</em></div>
  <div class="hc">
    <button id="bde" class="la" onclick="setLang('de')">DE</button>
    <button id="ben" onclick="setLang('en')">EN</button>
    <button id="bth" onclick="toggleTheme()" style="width:32px;height:32px;padding:0;font-size:15px">🌙</button>
  </div>
</header>

<div class="app">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="ss">
      <span class="slbl" data-t="start">Startort</span>
      <div class="sinp">
        <input type="text" id="sinput" placeholder="Stadt eingeben…" data-tp="city">
        <button class="bp" onclick="applyStart()" data-t="go">Los</button>
      </div>
      <div class="presets">
        <button onclick="setStart('Dresden',51.05,13.74,'p-dd')" id="p-dd" class="act">Dresden</button>
        <button onclick="setStart('Berlin',52.52,13.41,'p-be')" id="p-be">Berlin</button>
        <button onclick="setStart('München',48.14,11.58,'p-mu')" id="p-mu">München</button>
        <button onclick="setStart('Hamburg',53.55,10.00,'p-hh')" id="p-hh">Hamburg</button>
        <button onclick="setStart('Wien',48.21,16.37,'p-wi')" id="p-wi">Wien</button>
        <button onclick="setStart('Köln',50.94,6.96,'p-ko')" id="p-ko">Köln</button>
        <button onclick="setStart('Zürich',47.38,8.54,'p-zu')" id="p-zu">Zürich</button>
        <button onclick="setStart('Frankfurt',50.11,8.68,'p-ff')" id="p-ff">Frankfurt</button>
      </div>
    </div>

    <div class="ss">
      <span class="slbl" data-t="params">Parameter</span>
      <div class="srow">
        <span class="srow-lbl" data-t="hours">Stunden</span>
        <input type="range" min="1" max="20" value="11" step="1" id="slh" oninput="render()">
        <span class="sval" id="lh">11 h</span>
      </div>
      <div class="srow">
        <span class="srow-lbl" data-t="speed">Ø km/h</span>
        <input type="range" min="60" max="130" value="100" step="5" id="sls" oninput="render()">
        <span class="sval" id="ls">100 km/h</span>
      </div>
      <div class="stats">
        <div class="sc"><div class="sc-l" data-t="radius">Radius</div><div class="sc-v" id="sv-r">1.100 km</div></div>
        <div class="sc"><div class="sc-l" data-t="inrange">Im Radius</div><div class="sc-v g" id="sv-in">–</div></div>
        <div class="sc"><div class="sc-l" data-t="cities">Städte</div><div class="sc-v" id="sv-ci">–</div></div>
        <div class="sc"><div class="sc-l" data-t="nature">Natur</div><div class="sc-v" id="sv-na">–</div></div>
      </div>
    </div>

    <div class="ss">
      <span class="slbl" data-t="filter">Filter</span>
      <div class="ftabs">
        <button class="ftab act" data-f="all" onclick="setFilter('all')" data-t="all">Alle</button>
        <button class="ftab" data-f="in" onclick="setFilter('in')" data-t="inonly">Im Radius</button>
        <button class="ftab" data-f="city" onclick="setFilter('city')" data-t="fcities">Städte</button>
        <button class="ftab" data-f="nature" onclick="setFilter('nature')" data-t="fnature">Natur</button>
      </div>
      <div class="sort-row">
        <span data-t="sortby">Sortieren:</span>
        <select class="fsort" id="fsort" onchange="render()">
          <option value="dist" data-t="sdist">Distanz</option>
          <option value="name" data-t="sname">Name</option>
          <option value="type" data-t="stype">Typ</option>
        </select>
      </div>
    </div>

    <div class="ss">
      <span class="slbl" data-t="dest">Ziele</span>
      <ul class="clist" id="clist"></ul>
    </div>
  </aside>

  <!-- MAP -->
  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-info" id="map-info">
      <strong id="mi-start">Dresden</strong>
      <span id="mi-radius">Radius: 1.100 km</span>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="maybeClose(event)">
  <div class="modal">
    <button class="mclose" onclick="closeDetail()">✕</button>
    <div class="mname" id="mname"></div>
    <div class="mcountry" id="mcountry"></div>
    <div class="mstats" id="mstats"></div>
    <div class="msec"><h4 data-t="highlights">Highlights</h4><ul class="hllist" id="mhl"></ul></div>
    <div class="msec"><h4 data-t="climate">Klima & Reisezeit</h4><div class="wbadges" id="mwt"></div></div>
    <div class="msec"><h4 data-t="tips">Tipps</h4><p class="tips-p" id="mtips"></p></div>
    <div class="mlinks" id="mlinks"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ── I18N ──────────────────────────────────────────────────────────────────
var I = {
  de: { start:'Startort', params:'Parameter', hours:'Stunden', speed:'Ø km/h', radius:'Radius', inrange:'Im Radius', cities:'Städte', nature:'Natur', filter:'Filter', all:'Alle', inonly:'Im Radius', fcities:'Städte', fnature:'Natur', dest:'Ziele', sortby:'Sortieren:', sdist:'Distanz', sname:'Name', stype:'Typ', go:'Los', city:'Stadt eingeben…', h:'h', drive:'Fahrzeit', dist:'Luftlinie', inr:'✓ Erreichbar', outr:'✗ Außerhalb', highlights:'Highlights', climate:'Klima & Reisezeit', tips:'Tipps', city2:'Stadt', nat:'Natur', gmaps:'Google Maps', wiki:'Wikipedia' },
  en: { start:'Start', params:'Parameters', hours:'Hours', speed:'Avg km/h', radius:'Radius', inrange:'In Range', cities:'Cities', nature:'Nature', filter:'Filter', all:'All', inonly:'In Range', fcities:'Cities', fnature:'Nature', dest:'Destinations', sortby:'Sort:', sdist:'Distance', sname:'Name', stype:'Type', go:'Go', city:'Enter city…', h:'h', drive:'Drive time', dist:'Distance', inr:'✓ Reachable', outr:'✗ Out of range', highlights:'Highlights', climate:'Climate & Season', tips:'Tips', city2:'City', nat:'Nature', gmaps:'Google Maps', wiki:'Wikipedia' }
};
var lang = 'de';
function setLang(l) {
  lang = l;
  document.getElementById('bde').className = l === 'de' ? 'la' : '';
  document.getElementById('ben').className = l === 'en' ? 'la' : '';
  document.querySelectorAll('[data-t]').forEach(function(el) { var k = el.getAttribute('data-t'); if (I[l][k]) el.textContent = I[l][k]; });
  document.querySelectorAll('[data-tp]').forEach(function(el) { el.placeholder = I[l][el.getAttribute('data-tp')] || ''; });
  document.querySelectorAll('select option[data-t]').forEach(function(el) { var k = el.getAttribute('data-t'); if (I[l][k]) el.textContent = I[l][k]; });
  render();
}

// ── THEME ─────────────────────────────────────────────────────────────────
function toggleTheme() {
  var t = document.body.getAttribute('data-theme');
  var dark = t !== 'dark';
  document.body.setAttribute('data-theme', dark ? 'dark' : 'light');
  document.getElementById('bth').textContent = dark ? '☀️' : '🌙';
  if (map) {
    map.removeLayer(tileLayer);
    tileLayer = L.tileLayer(dark ? TILES.dark : TILES.light, { attribution: TILES.attr, maxZoom: 18 }).addTo(map);
  }
}

// ── KNOWN CITIES ──────────────────────────────────────────────────────────
var KNOWN = { dresden:[51.05,13.74], berlin:[52.52,13.41], münchen:[48.14,11.58], munich:[48.14,11.58], hamburg:[53.55,10.00], wien:[48.21,16.37], vienna:[48.21,16.37], köln:[50.94,6.96], cologne:[50.94,6.96], frankfurt:[50.11,8.68], leipzig:[51.34,12.38], hannover:[52.37,9.73], stuttgart:[48.78,9.18], zürich:[47.38,8.54], zurich:[47.38,8.54], prag:[50.08,14.44], prague:[50.08,14.44], warschau:[52.23,21.01], warsaw:[52.23,21.01], paris:[48.86,2.35], london:[51.51,-0.13], amsterdam:[52.37,4.90], brüssel:[50.85,4.35], brussels:[50.85,4.35], rom:[41.90,12.50], rome:[41.90,12.50], madrid:[40.42,-3.70], barcelona:[41.39,2.17], budapest:[47.50,19.04], oslo:[59.91,10.75], stockholm:[59.33,18.07], helsinki:[60.17,24.94], dublin:[53.33,-6.25], edinburgh:[55.95,-3.19], düsseldorf:[51.22,6.78], nürnberg:[49.45,11.08], bremen:[53.08,8.80], dortmund:[51.51,7.47] };

var START = { name: 'Dresden', lat: 51.05, lon: 13.74, pid: 'p-dd' };

function setStart(n, la, lo, pid) {
  START = { name: n, lat: la, lon: lo, pid: pid };
  document.getElementById('sinput').value = n;
  document.querySelectorAll('.presets button').forEach(function(b) { b.classList.remove('act'); });
  if (pid) { var el = document.getElementById(pid); if (el) el.classList.add('act'); }
  render();
}
function applyStart() {
  var v = document.getElementById('sinput').value.trim();
  var k = v.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  var coord = KNOWN[v.toLowerCase()] || KNOWN[k];
  if (coord) {
    START = { name: v, lat: coord[0], lon: coord[1], pid: null };
    document.querySelectorAll('.presets button').forEach(function(b) { b.classList.remove('act'); });
    render();
  } else {
    alert(lang === 'de' ? 'Stadt nicht gefunden – bitte Schnellwahl nutzen oder eine bekannte Stadt eingeben.' : 'City not found – please use a preset or type a known city.');
  }
}
document.getElementById('sinput').addEventListener('keydown', function(e) { if (e.key === 'Enter') applyStart(); });

// ── MATH ──────────────────────────────────────────────────────────────────
function hav(a, b, c, d) {
  var R = 6371, dL = (c - a) * Math.PI / 180, dl = (d - b) * Math.PI / 180;
  var q = Math.sin(dL/2)*Math.sin(dL/2) + Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dl/2)*Math.sin(dl/2);
  return R * 2 * Math.atan2(Math.sqrt(q), Math.sqrt(1 - q));
}
function fmtD(km) { return Math.round(km).toLocaleString(lang === 'de' ? 'de-DE' : 'en-GB') + ' km'; }
function fmtT(km, sp) { var h = km/sp, hh = Math.floor(h), mm = Math.round((h-hh)*60); return hh + 'h ' + mm + 'min'; }
function getR() { return +document.getElementById('slh').value * +document.getElementById('sls').value; }
function getSp() { return +document.getElementById('sls').value; }

// ── DESTINATIONS ──────────────────────────────────────────────────────────
var D = [

// ── FILTER ────────────────────────────────────────────────────────────────
var filt = 'all';
function setFilter(f) {
  filt = f;
  document.querySelectorAll('.ftab').forEach(function(t) { t.classList.toggle('act', t.dataset.f === f); });
  render();
}
function passes(d, r) {
  var dist = hav(START.lat, START.lon, d.la, d.lo);
  if (filt === 'in' && dist > r) return false;
  if (filt === 'city' && d.t !== 'city') return false;
  if (filt === 'nature' && d.t !== 'nature') return false;
  return true;
}

// ── LEAFLET MAP ───────────────────────────────────────────────────────────
var TILES = {
  light: 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  dark:  'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
  attr:  '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>'
};

var map = null;
var tileLayer = null;
var circleLayer = null;
var startMarker = null;
var destMarkers = [];

function initMap() {
  map = L.map('map', { zoomControl: true }).setView([START.lat, START.lon], 5);
  tileLayer = L.tileLayer(TILES.light, { attribution: TILES.attr, maxZoom: 18 }).addTo(map);
}

function makeIcon(color, size) {
  size = size || 10;
  return L.divIcon({
    className: '',
    html: '<div style="width:' + size + 'px;height:' + size + 'px;border-radius:50%;background:' + color + ';border:2px solid rgba(255,255,255,.8);box-shadow:0 1px 4px rgba(0,0,0,.3)"></div>',
    iconSize: [size, size],
    iconAnchor: [size/2, size/2]
  });
}

function makeStartIcon() {
  return L.divIcon({
    className: '',
    html: '<div style="width:16px;height:16px;border-radius:50%;background:#2a6bc8;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4)"></div>',
    iconSize: [16, 16],
    iconAnchor: [8, 8]
  });
}

function updateMap() {
  if (!map) return;
  var r = getR(), sp = getSp();

  // Remove old layers
  destMarkers.forEach(function(m) { map.removeLayer(m); });
  destMarkers = [];
  if (circleLayer) { map.removeLayer(circleLayer); }
  if (startMarker) { map.removeLayer(startMarker); }

  // Radius circle
  circleLayer = L.circle([START.lat, START.lon], {
    radius: r * 1000,
    color: '#c85a2a',
    weight: 2,
    dashArray: '8 6',
    fillColor: '#c85a2a',
    fillOpacity: 0.06
  }).addTo(map);

  // Start marker
  startMarker = L.marker([START.lat, START.lon], { icon: makeStartIcon(), zIndexOffset: 1000 })
    .bindPopup('<div class="popup-name">📍 ' + START.name + '</div><div class="popup-row" style="color:#6b6660">Startort</div>')
    .addTo(map);

  // Map info overlay
  document.getElementById('mi-start').textContent = START.name;
  document.getElementById('mi-radius').textContent = 'Radius: ' + fmtD(r);

  // Destination markers
  D.filter(function(d) { return passes(d, r); }).forEach(function(d) {
    var dist = Math.round(hav(START.lat, START.lon, d.la, d.lo));
    var inR = dist <= r;
    var color = inR ? (d.t === 'nature' ? '#2a7a50' : '#c85a2a') : '#a09a94';
    var size = inR ? 12 : 8;
    var marker = L.marker([d.la, d.lo], { icon: makeIcon(color, size) });

    var badgeCls = inR ? (d.t === 'nature' ? 'nat-in' : 'in') : 'out';
    var badgeTxt = inR ? (lang === 'de' ? '✓ Erreichbar' : '✓ Reachable') : (lang === 'de' ? '✗ Außerhalb' : '✗ Out of range');
    var name = lang === 'de' ? d.n : d.ne;

    var popupHtml = '<div class="popup-name">' + d.em + ' ' + name + '</div>' +
      '<div class="popup-row"><span>' + (lang === 'de' ? 'Luftlinie' : 'Distance') + '</span><span>' + fmtD(dist) + '</span></div>' +
      '<div class="popup-row"><span>' + (lang === 'de' ? 'Fahrzeit' : 'Drive time') + '</span><span>' + fmtT(dist, sp) + '</span></div>' +
      '<div><span class="popup-badge ' + badgeCls + '">' + badgeTxt + '</span></div>' +
      '<button class="popup-btn" onclick="openDetailByName(\'' + d.n.replace(/'/g, "\\'") + '\')">Details →</button>';

    marker.bindPopup(popupHtml, { maxWidth: 200 });
    marker.addTo(map);
    destMarkers.push(marker);
  });
}

// ── SIDEBAR LIST ──────────────────────────────────────────────────────────
function updateSidebar() {
  var r = getR(), sp = getSp();
  document.getElementById('lh').textContent = document.getElementById('slh').value + ' ' + I[lang].h;
  document.getElementById('ls').textContent = document.getElementById('sls').value + ' km/h';
  document.getElementById('sv-r').textContent = r.toLocaleString(lang === 'de' ? 'de-DE' : 'en-GB') + ' km';

  var all2 = D.map(function(d) { return Object.assign({}, d, { dist: Math.round(hav(START.lat, START.lon, d.la, d.lo)) }); });
  all2.forEach(function(d) { d.inR = d.dist <= r; });
  var inR2 = all2.filter(function(d) { return d.inR; });
  document.getElementById('sv-in').textContent = inR2.length;
  document.getElementById('sv-ci').textContent = inR2.filter(function(d) { return d.t === 'city'; }).length;
  document.getElementById('sv-na').textContent = inR2.filter(function(d) { return d.t === 'nature'; }).length;

  var shown = all2.filter(function(d) { return passes(d, r); });
  var sv = document.getElementById('fsort').value;
  shown.sort(function(a, b) {
    if (sv === 'name') return (lang === 'de' ? a.n : a.ne).localeCompare(lang === 'de' ? b.n : b.ne);
    if (sv === 'type') return a.t.localeCompare(b.t) || a.dist - b.dist;
    return a.dist - b.dist;
  });

  var ul = document.getElementById('clist'); ul.innerHTML = '';
  shown.forEach(function(d) {
    var li = document.createElement('li'); li.className = 'ci';
    var dotCls = d.inR ? (d.t === 'nature' ? 'nat' : '') : 'out';
    var typeTxt = lang === 'de' ? (d.t === 'city' ? 'Stadt' : 'Natur') : (d.t === 'city' ? 'City' : 'Nature');
    li.innerHTML = '<span class="cdot ' + dotCls + '"></span><span class="cn">' + (lang === 'de' ? d.n : d.ne) + '</span><span class="cd">' + fmtD(d.dist) + '</span><span class="ct ' + (d.t === 'nature' ? 'nat' : '') + '">' + typeTxt + '</span>';
    li.onclick = (function(dd) { return function() { openDetail(dd); }; })(d);
    ul.appendChild(li);
  });
}

function render() {
  updateSidebar();
  updateMap();
}

// ── DETAIL MODAL ──────────────────────────────────────────────────────────
function openDetailByName(n) {
  var d = D.find(function(x) { return x.n === n; });
  if (d) openDetail(d);
}
function openDetail(d) {
  var r = getR(), sp = getSp(), dist = Math.round(hav(START.lat, START.lon, d.la, d.lo)), inR = dist <= r;
  document.getElementById('mname').textContent = d.em + ' ' + (lang === 'de' ? d.n : d.ne);
  document.getElementById('mcountry').textContent = d.c;
  var sc = inR ? 'var(--acc)' : 'var(--ink3)';
  var tt = lang === 'de' ? (d.t === 'city' ? '🏙 Stadt' : '🌿 Natur') : (d.t === 'city' ? '🏙 City' : '🌿 Nature');
  document.getElementById('mstats').innerHTML =
    '<div class="ms"><div class="ms-l">' + I[lang].dist + '</div><div class="ms-v">' + fmtD(dist) + '</div></div>' +
    '<div class="ms"><div class="ms-l">' + I[lang].drive + '</div><div class="ms-v">' + fmtT(dist, sp) + '</div></div>' +
    '<div class="ms"><div class="ms-l">Typ</div><div class="ms-v">' + tt + '</div></div>' +
    '<div class="ms"><div class="ms-l">Status</div><div class="ms-v" style="color:' + sc + ';font-size:12px">' + (inR ? I[lang].inr : I[lang].outr) + '</div></div>';
  document.getElementById('mhl').innerHTML = (lang === 'de' ? d.h.de : d.h.en).map(function(h) { return '<li>' + h + '</li>'; }).join('');
  document.getElementById('mwt').innerHTML = (lang === 'de' ? d.w.de : d.w.en).map(function(w) { return '<span class="wb">' + w + '</span>'; }).join('');
  document.getElementById('mtips').textContent = lang === 'de' ? d.ti.de : d.ti.en;
  var name = encodeURIComponent((lang === 'de' ? d.n : d.ne) + ' ' + d.c);
  var wikiLang = lang === 'de' ? 'de' : 'en';
  document.getElementById('mlinks').innerHTML =
    '<a href="https://www.google.com/maps/search/' + name + '" target="_blank">🗺 ' + I[lang].gmaps + '</a>' +
    '<a href="https://' + wikiLang + '.wikipedia.org/wiki/Special:Search/' + name + '" target="_blank">📖 ' + I[lang].wiki + '</a>';
  document.getElementById('overlay').classList.add('open');
}
function closeDetail() { document.getElementById('overlay').classList.remove('open'); }
function maybeClose(e) { if (e.target === document.getElementById('overlay')) closeDetail(); }
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeDetail(); });

// ── INIT ──────────────────────────────────────────────────────────────────
document.getElementById('sinput').value = START.name;
initMap();
render();
</script>
